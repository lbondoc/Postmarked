name: CI

on:
  push:
  pull_request:

jobs:
  # Applies the migrations to a throwaway Postgres + PostGIS and runs the access-rule tests.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: ./supabase/tests/run.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:domain:jvmTest
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug
      # Download this from the run's page to install the app on a phone without Android Studio.
      - uses: actions/upload-artifact@v4
        with:
          name: postmarked-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
