name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # run by hand from the Actions tab; the ios job runs only then and on main

jobs:
  # Applies the migrations to a throwaway Postgres + PostGIS and runs the access-rule tests.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: ./supabase/tests/run.sh

  # Tests the server function that turns stops into road routes.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:domain:jvmTest :core:domain:wasmJsNodeTest :composeApp:testAndroidHostTest
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug
      # The website shares composeApp; every change must still compile for the browser (TASKS.md, from P2 on).
      - name: Compile the web build
        run: ./gradlew :composeApp:compileKotlinWasmJs
      # The app's fonts and theme files must be inside the APK; without them it crashes on opening a trip.
      - name: Check the APK carries the app's resources
        run: unzip -l androidApp/build/outputs/apk/debug/*.apk | grep -q 'postmarked.resources/files/themes/index.json' && unzip -l androidApp/build/outputs/apk/debug/*.apk | grep -q 'postmarked.resources/files/presets/index.json'
      # Download this from the run's page to install the app on a phone without Android Studio.
      - uses: actions/upload-artifact@v4
        with:
          name: postmarked-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  # Builds the website and checks it opens on the sign-in screen without errors. On main the build is also
  # handed to the pages job, which publishes it.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the website
        run: ./gradlew :webApp:wasmJsBrowserDistribution
      - name: Smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node web/smoke.mjs
          node web/smoke.mjs --share
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  # Publishes the website to GitHub Pages (free for public repositories): https://lbondoc.github.io/Postmarked/
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Compiles the app for iOS and runs the shared logic's tests in the iOS simulator. There's no Mac to build on,
  # and macOS runner minutes are scarce on the free plan, so only on main and when started by hand (SPEC §1.3).
  ios:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:domain:iosSimulatorArm64Test :composeApp:compileKotlinIosSimulatorArm64
